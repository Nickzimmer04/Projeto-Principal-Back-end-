
name: fastapi-docker-test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Poetry
        run: pip install poetry

      - name: Instalar dependências
        run: poetry install --no-root

      - name: Configurar banco para testes
        run: echo "DATABASE_URL=sqlite:///./test.db" >> $GITHUB_ENV

      - name: Executar testes
        run: poetry run pytest

    
      - name: Build da imagem Docker
        run: docker build -t fastapi-app:latest .

      - name: Executar container Docker
        run: |
          docker run -d \
            --name fastapi-test \
            -p 8000:8000 \
            -e DATABASE_URL=sqlite:///./test.db \
            fastapi-app:latest


      - name: Validar inicialização do container
        run: |
          sleep 5
          if [ "$(docker inspect -f '{{.State.Running}}' fastapi-test)" != "true" ]; then
            docker logs fastapi-test
            exit 1
          fi
